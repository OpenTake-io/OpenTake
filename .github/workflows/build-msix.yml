name: Build MSIX Package

on:
  workflow_dispatch:
    inputs:
      sign_package:
        description: Sign the MSIX package
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [dev, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/antislop.yml'
      - '.github/workflows/auto-translate-zh.yml'
      - '.github/workflows/homebrew-tap.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/winget-releaser.yml'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-windows-msix:
    name: Build Windows MSIX
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Windows signing
        if: inputs.sign_package == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_P12_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_P12_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Warning 'Windows signing secrets are missing. Building an unsigned package.'
            Add-Content -Path $env:GITHUB_ENV -Value 'CSC_IDENTITY_AUTO_DISCOVERY=false'
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP 'windows-signing-cert.p12'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_P12_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$certPath"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node scripts/install-ffmpeg-static.mjs

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Remove stale uiohook build output
        shell: pwsh
        run: |
          if (Test-Path node_modules/uiohook-napi/build) {
            Remove-Item node_modules/uiohook-napi/build -Recurse -Force
          }

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate MSIX assets
        shell: pwsh
        run: python scripts/prepare-msix-assets.py

      - name: Build Windows app
        shell: pwsh
        run: |
          npm run build:native-helpers
          npm run build:windows-capture
          npm run build:windows-gpu-export
          npm run build:cursor-monitor
          npm run build:whisper-runtime
          npx tsc
          npx vite build
          npx electron-builder --win dir --x64 --publish never

      - name: Create MSIX package
        shell: pwsh
        run: |
          # Find the packaged app directory
          $appDir = Get-ChildItem -Path "release" -Directory | Where-Object { $_.Name -like "win*" } | Select-Object -First 1
          if (-not $appDir) {
            Write-Error "Could not find packaged app directory"
            exit 1
          }

          $sourceDir = $appDir.FullName
          Write-Host "Source directory: $sourceDir"

          # Create MSIX output directory
          $msixDir = "release\msix"
          New-Item -ItemType Directory -Path $msixDir -Force | Out-Null

          # Create the MSIX package structure
          $packageDir = Join-Path $msixDir "package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          # Copy app files to package directory
          Write-Host "Copying app files..."
          Copy-Item -Path "$sourceDir\*" -Destination $packageDir -Recurse -Force

          # Copy MSIX assets
          Write-Host "Copying MSIX assets..."
          $assetsDir = "build\msix-assets"
          if (Test-Path $assetsDir) {
            Copy-Item -Path "$assetsDir\*" -Destination $packageDir -Force
          }

          # Copy AppxManifest.xml
          Write-Host "Copying AppxManifest.xml..."
          if (Test-Path "build\AppxManifest.xml") {
            Copy-Item -Path "build\AppxManifest.xml" -Destination $packageDir -Force
          }

          # Find MakeAppx.exe
          $makeAppx = $null
          $paths = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\MakeAppx.exe",
            "$env:ProgramFiles\Windows Kits\10\bin\*\x64\MakeAppx.exe"
          )
          foreach ($path in $paths) {
            $found = Get-ChildItem -Path $path -ErrorAction SilentlyContinue | Sort-Object -Property VersionInfo.FileVersion -Descending | Select-Object -First 1
            if ($found) {
              $makeAppx = $found.FullName
              break
            }
          }

          if (-not $makeAppx) {
            Write-Warning "MakeAppx.exe not found. Using alternative method..."
            # Use Compress-Archive as fallback
            $msixFile = Join-Path $msixDir "OpenTake-0.1.0-x64.msix"
            Compress-Archive -Path "$packageDir\*" -DestinationPath $msixFile -Force
            Write-Host "Created MSIX package (ZIP format): $msixFile"
          } else {
            Write-Host "Using MakeAppx.exe: $makeAppx"
            $msixFile = Join-Path $msixDir "OpenTake-0.1.0-x64.msix"
            & $makeAppx pack /d $packageDir /p $msixFile /o
            Write-Host "Created MSIX package: $msixFile"
          }

      - name: Smoke test packaged Windows paths
        run: npm run smoke:packaged-binaries

      - name: Generate Windows MSIX artifact checksums
        run: npm run checksums:release -- SHA256SUMS-windows-msix.txt

      - name: Attest Windows MSIX artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-windows-msix.txt

      - name: Upload Windows MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-release
          path: |
            release/msix/*.msix
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30
